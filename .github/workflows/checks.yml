name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Browser tool checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run Node tests
        run: node --test tests/tree-scaffold-tool.test.mjs tests/cytoscape-import-tool.test.mjs

  python:
    name: Synthetic workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install workflow dependencies
        run: python -m pip install -r cytoscape/workflows/functional-module-evidence-mapping/requirements.txt
      - name: Run synthetic integration tests
        run: python -m unittest discover -s cytoscape/workflows/functional-module-evidence-mapping/tests -v
